{% extends "base.html" %}
{% block structured %}<script type="application/ld+json">{{ website_json|safe }}</script>{% endblock %}
{% block content %}
<section class="hero"><p class="eyebrow">지역과 학교별 학습 정보</p><h1>좋은공부</h1><p>학년과 과목, 생활권에 맞는 과외 학습 방향을 단계적으로 찾아보세요.</p></section>
<section><h2>지역별 학습 정보 살펴보기</h2><div class="cards">{% for item in pages %}<a class="card" href="/{{ item.slug }}/"><strong>{{ item.link_label }}</strong><span>{{ item.province }} {{ item.city }} {{ item.locality }}</span></a>{% endfor %}</div></section>
{% endblock %}
